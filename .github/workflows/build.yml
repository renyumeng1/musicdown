name: build musicdown

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "**.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: ubuntu-latest
            arch: x64
          - os: macos-13
            arch: x64
          - os: macos-14
            arch: arm64

    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
          architecture: ${{ matrix.arch }}

      - name: Get arch
        id: arch
        shell: bash
        run: |
          if [[ ${{ matrix.arch }} == 'x64' ]]; then
            echo "arch=amd64" >> $GITHUB_OUTPUT
            echo "nuitka_arch=x86_64" >> $GITHUB_OUTPUT
          elif [[ ${{ matrix.arch }} == 'arm64' ]]; then
            echo "arch=arm64" >> $GITHUB_OUTPUT
            echo "nuitka_arch=arm64" >> $GITHUB_OUTPUT
          elif [[ ${{ matrix.arch }} == 'win32' ]]; then
            echo "arch=x86" >> $GITHUB_OUTPUT
            echo "nuitka_arch=universal" >> $GITHUB_OUTPUT
          fi
      
      - name: Install dependencies (uv)
        shell: bash
        run: |
          python -m pip install -U uv
          uv sync --frozen --no-install-project

      - name: Use venv (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Use venv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "$env:GITHUB_WORKSPACE\\.venv\\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      
      - name: Install upx/7zip
        if: ${{ runner.os == 'Windows' }}
        run: |
          choco install upx 7zip -y

      - name: mkdir
        run: |
          mkdir -p dist
          mkdir -p upload
      
      - name: Get Information
        id: info
        shell: bash
        run: |
          echo "copyright=Copyright (C) $(date +%Y) musicdown" >> $GITHUB_OUTPUT
          echo "version=$(date +%Y.%m.%d)" >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT

      - name: Build Executable(Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          uv run python -m nuitka --mode=standalone --enable-plugin=pyside6 --assume-yes-for-downloads --mingw64 --windows-console-mode=disable --windows-icon-from-ico=ui/icon.ico --product-name=musicdown --file-version=${{ steps.info.outputs.version }} --product-version=${{ steps.info.outputs.version }} --include-data-dir=ui=ui --output-dir=build main.py

      - name: Build Executable(Linux)
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          uv run python -m nuitka --mode=standalone --enable-plugin=pyside6 --assume-yes-for-downloads --product-name=musicdown --file-version=${{ steps.info.outputs.version }} --product-version=${{ steps.info.outputs.version }} --include-data-dir=ui=ui --output-dir=build main.py

      - name: Build Executable(macOS)
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          from PIL import Image

          src = Path("ui/icon.ico")
          dst = Path("ui/icon.png")

          if src.exists():
              img = Image.open(src)
              # Choose the largest frame if the ICO contains multiple sizes.
              try:
                  largest_index = 0
                  largest_area = 0
                  for i in range(getattr(img, "n_frames", 1)):
                      img.seek(i)
                      w, h = img.size
                      area = w * h
                      if area > largest_area:
                          largest_area = area
                          largest_index = i
                  img.seek(largest_index)
              except Exception:
                  pass

              img = img.convert("RGBA")
              dst.parent.mkdir(parents=True, exist_ok=True)
              img.save(dst)
              print(f"Generated macOS icon: {dst}")
          else:
              print("ui/icon.ico not found; macOS app icon will be default.")
          PY

          ICON_ARG=""
          if [[ -f ui/icon.png ]]; then
            ICON_ARG="--macos-app-icon=ui/icon.png"
            # Nuitka needs imageio to convert PNG to native macOS ICNS internally.
            uv pip install imageio
          fi

          uv run python -m nuitka \
            --mode=app \
            --enable-plugin=pyside6 \
            --assume-yes-for-downloads \
            --product-name=musicdown \
            --macos-app-name=musicdown \
            --output-filename=musicdown \
            ${ICON_ARG} \
            --file-version=${{ steps.info.outputs.version }} \
            --product-version=${{ steps.info.outputs.version }} \
            --include-data-dir=ui=ui \
            --output-dir=build \
            main.py

      - name: Codesign app (macOS)
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          APP_PATH="$(ls -d build/*.app | head -n 1)"
          if [[ -z "${APP_PATH}" ]]; then
            echo "No .app produced under build/"
            ls -la build
            exit 1
          fi
          TARGET_PATH="build/musicdown.app"
          if [[ "${APP_PATH}" != "${TARGET_PATH}" ]]; then
            rm -rf "${TARGET_PATH}"
            mv "${APP_PATH}" "${TARGET_PATH}"
            APP_PATH="${TARGET_PATH}"
          fi
          echo "Runner arch: $(uname -m)"
          echo "App path: ${APP_PATH}"
          codesign --force --deep --sign - "${APP_PATH}"
          codesign --verify --deep --verbose=2 "${APP_PATH}"
          echo "App executable(s):"
          ls -la "${APP_PATH}/Contents/MacOS" || true
          file "${APP_PATH}/Contents/MacOS/"* || true
          echo "Gatekeeper check (expected to fail without notarization):"
          spctl -a -vv "${APP_PATH}" || true

      - name: Build Installer (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: |
          choco install innosetup -y
          iscc /DMyAppVersion=${{ steps.info.outputs.version }} packaging\\windows\\musicdown.iss

      - name: Compress exe (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: |
          Rename-Item -Path "build/main.dist" -NewName "musicdown"
          cd build
          7z a -tzip -mx=9 ../upload/musicdown-${{ steps.info.outputs.version }}-windows-${{ steps.arch.outputs.arch }}.zip musicdown

      - name: Compress exe (Linux)
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          mv build/main.dist build/musicdown
          cd build
          zip -r ../upload/musicdown-${{ steps.info.outputs.version }}-${{ runner.os }}-${{ steps.arch.outputs.arch }}.zip musicdown

      - name: Compress app (macOS)
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          APP_PATH="build/musicdown.app"
          if [[ ! -d "${APP_PATH}" ]]; then
            APP_PATH="$(ls -d build/*.app | head -n 1)"
          fi
          if [[ -z "${APP_PATH}" ]]; then
            echo "No .app produced under build/"
            ls -la build
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "${APP_PATH}" "upload/musicdown-${{ steps.info.outputs.version }}-macos-${{ steps.arch.outputs.arch }}.zip"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }} - ${{ matrix.arch }} artifacts
          path: |
            upload/
