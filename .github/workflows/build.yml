name: build musicdown

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "**.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        arch: [x64]

    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
          architecture: ${{ matrix.arch }}

      - name: Get arch
        id: arch
        shell: bash
        run: |
          if [[ ${{ matrix.arch }} == 'x64' ]]; then
            echo "arch=amd64" >> $GITHUB_OUTPUT
            echo "nuitka_arch=x86_64" >> $GITHUB_OUTPUT
          elif [[ ${{ matrix.arch }} == 'arm64' ]]; then
            echo "arch=arm64" >> $GITHUB_OUTPUT
            echo "nuitka_arch=arm64" >> $GITHUB_OUTPUT
          elif [[ ${{ matrix.arch }} == 'win32' ]]; then
            echo "arch=x86" >> $GITHUB_OUTPUT
            echo "nuitka_arch=universal" >> $GITHUB_OUTPUT
          fi
      
      - name: Install dependencies (uv)
        shell: bash
        run: |
          python -m pip install -U uv
          uv sync --frozen --no-install-project

      - name: Use venv (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Use venv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "$env:GITHUB_WORKSPACE\\.venv\\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      
      - name: Install upx/7zip
        if: ${{ runner.os == 'Windows' }}
        run: |
          choco install upx 7zip -y

      - name: mkdir
        run: |
          mkdir -p dist
          mkdir -p upload
      
      - name: Get Information
        id: info
        shell: bash
        run: |
          echo "copyright=Copyright (C) $(date +%Y) musicdown" >> $GITHUB_OUTPUT
          echo "version=$(date +%Y.%m.%d)" >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT

      - name: Build Executable(Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: main.py

          mode: standalone
          enable-plugins: pyqt6
          product-name: "musicdown"
          file-version: ${{ steps.info.outputs.version }}
          product-version: ${{ steps.info.outputs.version }}
          copyright: ${{ steps.info.outputs.copyright }}

          windows-icon-from-ico: "ui/icon.ico"
          mingw64: true
          windows-disable-console: true

          include-package: utils,ui,api,decryptor,downloader
          include-data-dir: "ui=ui"

      - name: Build Executable(Linux)
        if: ${{ runner.os == 'Linux' }}
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: main.py

          mode: standalone
          enable-plugins: pyqt6
          product-name: "musicdown"
          file-version: ${{ steps.info.outputs.version }}
          product-version: ${{ steps.info.outputs.version }}
          copyright: ${{ steps.info.outputs.copyright }}

          include-package: utils,ui,api,decryptor,downloader
          include-data-dir: "ui=ui"

      - name: Build Executable(macOS)
        if: ${{ runner.os == 'macOS' }}
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: main.py

          mode: app
          enable-plugins: pyqt6
          product-name: "musicdown"
          file-version: ${{ steps.info.outputs.version }}
          product-version: ${{ steps.info.outputs.version }}
          copyright: ${{ steps.info.outputs.copyright }}

          include-package: utils,ui,api,decryptor,downloader
          include-data-dir: "ui=ui"

      - name: Build Installer (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: |
          choco install innosetup -y
          iscc /DMyAppVersion=${{ steps.info.outputs.version }} packaging\\windows\\musicdown.iss

      - name: Compress exe (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: |
          Rename-Item -Path "build/main.dist" -NewName "musicdown"
          cd build
          7z a -tzip -mx=9 ../upload/musicdown-${{ steps.info.outputs.version }}-windows-${{ steps.arch.outputs.arch }}.zip musicdown

      - name: Compress exe (Linux)
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          mv build/main.dist build/musicdown
          cd build
          zip -r ../upload/musicdown-${{ steps.info.outputs.version }}-${{ runner.os }}-${{ steps.arch.outputs.arch }}.zip musicdown

      - name: Compress app (macOS)
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          APP_PATH="$(ls -d build/*.app | head -n 1)"
          if [[ -z "${APP_PATH}" ]]; then
            echo "No .app produced under build/"
            ls -la build
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "${APP_PATH}" "upload/musicdown-${{ steps.info.outputs.version }}-macos-${{ steps.arch.outputs.arch }}.zip"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }} - ${{ matrix.arch }} artifacts
          path: |
            upload/
