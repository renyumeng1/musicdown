<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Music Downloader{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
</head>
<body>
    <div class="container">
        <header class="site-header">
            <nav class="top-nav">
                <a class="brand" href="/"><i class="fas fa-music"></i> MusicDown</a>
                <div class="nav-links">
                    <a href="/playlist" class="nav-item"><i class="fas fa-list-music"></i> 歌单</a>
                    <a href="/daily" class="nav-item"><i class="fas fa-calendar-day"></i> 每日推荐</a>
                </div>
            </nav>
            <div class="page-header">
                {% block header %}{% endblock %}
            </div>
        </header>
        <main>
            {% block content %}{% endblock %}
        </main>
        <footer>
            <p class="footer-text">
                &copy; 2025 Music Downloader | <a href="/" class="nav-link">首页</a>
            </p>
        </footer>
    </div>
</body>
</html>
